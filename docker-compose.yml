services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether_change_me}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_change_me}"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-redis_change_me}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aether:${POSTGRES_PASSWORD:-aether_change_me}@postgres:5432/aether
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_me}@redis:6379/0
    ports: ["8080:8000"]
    volumes: ["appdata:/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [private]
  worker:
    build: .
    command: ["rq", "worker", "--url", "redis://:${REDIS_PASSWORD:-redis_change_me}@redis:6379/0", "aether"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aether:${POSTGRES_PASSWORD:-aether_change_me}@postgres:5432/aether
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_me}@redis:6379/0
    volumes: ["appdata:/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [private]
networks:
  private:
    driver: bridge
volumes:
  pgdata:
  redisdata:
  appdata:
